name: AxyomCore
description: >-
  Telecom infrastructure software vendor, styled Axyom.Core, supplying cloud-native 4G and 5G mobile
  core and RAN network functions (CNFs) that run inside communications service provider networks.
  Product lines cover 4G core, Femto core, security gateway, RAN and full-MVNO deployments, with
  Red Hat OpenShift support. Part of Lumine Group following a carve-out from Casa Systems.
  NO PUBLIC API SURFACE: the company sells into operator networks through RFP and direct
  engagement, and publishes no developer portal, API documentation, or machine-readable contract.
  That is an absence of a PUBLIC interface, not an absence of APIs — mobile core network functions
  are API-driven by construction, but those interfaces reach customers under operator contracts
  rather than a public developer program.
